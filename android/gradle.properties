org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# flutter.compileSdkVersion risolveva a 31 di default in alcuni ambienti di
# build (Codemagic incluso) - troppo vecchio per i plugin usati (flutter_appauth
# richiede almeno 34). Questo override vale per l'app E per i moduli dei plugin,
# a differenza di un compileSdk fissato solo in app/build.gradle.kts.
flutter.compileSdkVersion=36
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
